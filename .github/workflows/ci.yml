name: CI

# Compile + tests on every push and PR; builds and container publish on main.
#
# The compile job is the gate that matters. A Unity project can look completely
# healthy in version control and still not build, because nothing in the repo
# forces the compiler to run — .cs files, .asmdef files and package versions are
# all just text until an editor opens them.

on:
  push:
    branches: [main, develop, "release/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UNITY_VERSION: 6000.0.25f1
  PROJECT_PATH: .

jobs:
  editmode:
    name: EditMode tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      # Library/ is the single biggest CI cost on a Unity project — a cold import
      # resolves and reimports every package. Keyed on the manifest so a
      # dependency change invalidates it and nothing else does.
      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Packages/manifest.json') }}
          restore-keys: Library-

      - uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          projectPath: ${{ env.PROJECT_PATH }}
          testMode: editmode
          artifactsPath: artifacts/editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: EditMode results

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editmode-results
          path: artifacts/editmode

  playmode:
    name: PlayMode tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: editmode

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Packages/manifest.json') }}
          restore-keys: Library-

      - uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          projectPath: ${{ env.PROJECT_PATH }}
          testMode: playmode
          artifactsPath: artifacts/playmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: PlayMode results

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playmode-results
          path: artifacts/playmode

  build-client:
    name: Build Windows client
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [editmode, playmode]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-client-${{ hashFiles('Packages/manifest.json') }}
          restore-keys: Library-

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          projectPath: ${{ env.PROJECT_PATH }}
          targetPlatform: StandaloneWindows64
          buildMethod: Vigil.Editor.Tools.VigilBuildPipeline.BuildWindowsClient
          buildName: Vigil

      - uses: actions/upload-artifact@v4
        with:
          name: Vigil-WindowsClient
          path: Build/WindowsClient

  build-server:
    name: Build Linux dedicated server
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [editmode, playmode]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-server-${{ hashFiles('Packages/manifest.json') }}
          restore-keys: Library-

      # game-ci's image carries the Linux Dedicated Server module, which is why
      # the server is built here rather than on a developer machine.
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          projectPath: ${{ env.PROJECT_PATH }}
          targetPlatform: StandaloneLinux64
          buildMethod: Vigil.Editor.Tools.VigilBuildPipeline.BuildLinuxServer
          buildName: VigilServer

      - name: Verify the binary actually exists
        # VigilBuildPipeline exits non-zero on failure, but a wrong output path
        # would still produce a "successful" job with nothing to package.
        run: |
          test -f Build/LinuxServer/VigilServer || { echo "::error::server binary missing"; exit 1; }
          chmod +x Build/LinuxServer/VigilServer
          ls -lh Build/LinuxServer

      - uses: actions/upload-artifact@v4
        with:
          name: Vigil-LinuxServer
          path: Build/LinuxServer

  publish-server-image:
    name: Publish server container
    runs-on: ubuntu-latest
    needs: build-server
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Vigil-LinuxServer
          path: Build/LinuxServer

      - run: chmod +x Build/LinuxServer/VigilServer

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/vigil-server:latest
            ghcr.io/${{ github.repository }}/vigil-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
